<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>粒子シミュレーション</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060a; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; background: #0b0d12; }
  #panel { position: fixed; top: 12px; left: 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
           font: 600 14px sans-serif; color: #fff; }
  #panel input, #panel button { padding: 8px 10px; font: inherit; color: #fff; background: #1d2230;
           border: 1px solid #3a4157; border-radius: 6px; }
  #count { width: 4.5em; }
  #speed { width: 9em; vertical-align: middle; padding: 0; }
  #speedLabel { display: inline-block; min-width: 3em; font-variant-numeric: tabular-nums; }
  #reset { padding: 8px 14px; cursor: pointer; }
  #reset:hover { background: #2a3045; }
  #panel :focus-visible { outline: 2px solid #4d8dff; outline-offset: 2px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <label>粒子数 <input id="count" type="number" min="3" max="300" step="1" value="80"></label>
  <label>速度 <input id="speed" type="range" min="0" max="5" step="0.1" value="1"> <span id="speedLabel">×1.0</span></label>
  <button id="reset" type="button">初期状態に戻す</button>
</div>
<script>
(() => {
  let N = 80;                // 粒子数 (画面の入力欄で変更可)
  const N_MIN = 3, N_MAX = 300;
  const COLORS = ['#ff4d4d', '#4dff6a', '#4d8dff'];
  const R = 5;               // 粒子の半径
  const LINK_DIST = 45;      // 「隣接」とみなす距離
  const K_ATTR = 18;         // 引力の係数 (同色)
  const K_REP = 26;          // 斥力の係数 (異色)
  const NEAR = 28;           // これより近いと反発を強める
  const K_NEAR = 900;        // 近距離反発の係数
  const MAX_FORCE_DIST = 250;// 力が届く最大距離
  const DAMPING = 0.995;
  const MAX_SPEED = 3;

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  // シミュレーション空間は固定サイズ。ウィンドウに合わせて表示だけ拡大縮小する
  const W = 960, H = 600;

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
    canvas.style.width = W * scale + 'px';
    canvas.style.height = H * scale + 'px';
    canvas.width = Math.round(W * scale * dpr);
    canvas.height = Math.round(H * scale * dpr);
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  }

  // 色を均等配分 (例: 80個 → 27/27/26) し、位置・速度をランダムに初期化
  const particles = [];

  function init() {
    particles.length = 0;
    for (let i = 0; i < N; i++) {
      particles.push({
        x: R + Math.random() * (W - 2 * R),
        y: R + Math.random() * (H - 2 * R),
        vx: (Math.random() - 0.5) * 1,
        vy: (Math.random() - 0.5) * 1,
        c: i % 3
      });
    }
    for (let i = N - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [particles[i].c, particles[j].c] = [particles[j].c, particles[i].c];
    }
  }
  const countInput = document.getElementById('count');
  countInput.value = N;
  function applyCount() {
    const v = Math.round(Number(countInput.value));
    if (!Number.isFinite(v)) { countInput.value = N; return; }
    N = Math.min(N_MAX, Math.max(N_MIN, v));
    countInput.value = N;
    init();
  }
  countInput.addEventListener('change', applyCount);

  let speed = 1;             // 速度倍率
  const speedInput = document.getElementById('speed');
  const speedLabel = document.getElementById('speedLabel');
  function applySpeed() {
    speed = Number(speedInput.value);
    speedLabel.textContent = '×' + speed.toFixed(1);
  }
  speedInput.addEventListener('input', applySpeed);
  applySpeed();
  init();
  document.getElementById('reset').addEventListener('click', applyCount);
  window.addEventListener('resize', resize);
  resize();

  // dt: 時間刻み (1 = 通常速度)。倍率が大きいときは loop で小刻みに分割して呼ぶ
  function step(dt) {
    for (let i = 0; i < N; i++) {
      const a = particles[i];
      let fx = 0, fy = 0;
      for (let j = 0; j < N; j++) {
        if (i === j) continue;
        const b = particles[j];
        const dx = b.x - a.x, dy = b.y - a.y;
        const d2 = dx * dx + dy * dy;
        const d = Math.sqrt(d2) || 0.001;
        if (d > MAX_FORCE_DIST) continue;
        const ux = dx / d, uy = dy / d;
        // 距離の逆数に比例。同色=引力(+)、異色=斥力(-)
        let f = (a.c === b.c ? K_ATTR : -K_REP) / Math.max(d, 1);
        // 近すぎる場合は色に関係なく強く反発
        if (d < NEAR) {
          const t = (NEAR - d) / NEAR;
          f -= K_NEAR * t * t / Math.max(d, 1);
        }
        fx += f * ux;
        fy += f * uy;
      }
      a.vx += fx * 0.05 * dt;
      a.vy += fy * 0.05 * dt;
    }
    for (const p of particles) {
      const damp = Math.pow(DAMPING, dt);
      p.vx *= damp; p.vy *= damp;
      const s = Math.hypot(p.vx, p.vy);
      if (s > MAX_SPEED) { p.vx *= MAX_SPEED / s; p.vy *= MAX_SPEED / s; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.x < R)     { p.x = R;     p.vx = Math.abs(p.vx); }
      if (p.x > W - R) { p.x = W - R; p.vx = -Math.abs(p.vx); }
      if (p.y < R)     { p.y = R;     p.vy = Math.abs(p.vy); }
      if (p.y > H - R) { p.y = H - R; p.vy = -Math.abs(p.vy); }
    }
  }

  // 同色かつ LINK_DIST 以内の粒子を辺で結んだ連結成分の数 (Union-Find)
  function countClusters() {
    const parent = Array.from({ length: N }, (_, i) => i);
    const find = x => { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; };
    for (let i = 0; i < N; i++) {
      for (let j = i + 1; j < N; j++) {
        const a = particles[i], b = particles[j];
        if (a.c !== b.c) continue;
        if (Math.hypot(a.x - b.x, a.y - b.y) <= LINK_DIST) {
          parent[find(i)] = find(j);
        }
      }
    }
    const roots = new Set();
    for (let i = 0; i < N; i++) roots.add(find(i));
    return roots.size;
  }

  function draw(clusters) {
    ctx.fillStyle = '#0b0d12';
    ctx.fillRect(0, 0, W, H);
    for (const p of particles) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, R, 0, Math.PI * 2);
      ctx.fillStyle = COLORS[p.c];
      ctx.fill();
    }
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'top';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('同色クラスタ数: ' + clusters, W - 16, 16);
  }

  function loop() {
    // 速度倍率ぶんの時間を、1以下の刻みに分けて進める (高倍率でも粒子がすり抜けにくい)
    for (let t = speed; t > 1e-6; t -= 1) step(Math.min(1, t));
    draw(countClusters());
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
</body>
</html>
