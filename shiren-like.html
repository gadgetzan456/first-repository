    if (hasShield) {
      ctx.strokeStyle = "#5f6a72";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(TILE * 0.16, TILE * 0.04, TILE * 0.075, TILE * 0.12, 0, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.fillStyle = c.cape;
    ctx.beginPath();
    ctx.moveTo(-TILE * 0.06, -TILE * 0.24);
    ctx.lineTo(TILE * 0.22, -TILE * 0.20);
    ctx.lineTo(TILE * 0.27, TILE * 0.29);
    ctx.lineTo(-TILE * 0.16, TILE * 0.30);
    ctx.closePath();
    ctx.fill();

    // 脚(マントより手前に描き、裾から覗かせる)
    ctx.fillStyle = c.leg;
    ctx.fillRect(-TILE * 0.14, TILE * 0.08, TILE * 0.095, TILE * 0.23);
    ctx.fillRect(TILE * 0.01, TILE * 0.07, TILE * 0.095, TILE * 0.24);

    ctx.fillStyle = c.skin;
    ctx.fillRect(-TILE * 0.21, -TILE * 0.04, TILE * 0.06, TILE * 0.16);

    drawHeldWeapon(TILE * 0.11, -TILE * 0.19, TILE * 0.28, -TILE * 0.29, hasWeapon);

    // 頭はほぼ髪で覆われ、進行方向側にわずかに顔の輪郭が覗く程度
    ctx.fillStyle = c.skin;
    ctx.beginPath();
    ctx.arc(-TILE * 0.01, -TILE * 0.26, TILE * 0.145, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = c.hair;
    ctx.beginPath();
    ctx.arc(-TILE * 0.01, -TILE * 0.26, TILE * 0.155, -Math.PI * 0.4, Math.PI * 0.85);
    ctx.closePath();
    ctx.fill();
  }

  function drawPlayerFigure(x, y) {
    var cx = x * TILE + TILE / 2, cy = y * TILE + TILE / 2;
    var c = { skin: "#e0b48a", hair: "#5a3c28", tunic: "#3f6b52", cape: "#a5502c", leg: "#3a2e22" };
    var facing = (G.player && G.player.facing) || { dx: 0, dy: 1 };
    var dx = facing.dx, dy = facing.dy;
    var hasShield = !!(G.player && G.player.shield);
    var hasWeapon = !!(G.player && G.player.weapon);

    drawShadow(cx, cy + TILE * 0.36, TILE * 0.32);

    ctx.save();
    ctx.translate(cx, cy);
    // 8方向それぞれに専用の立ち絵を用意し、単純な回転では出せない
    // 「ちゃんと立って、その方向を向いている」見た目にする。左右は左向きの
    // 絵を鏡像反転して使い回す。
    if (dx === 0 && dy > 0) {
      drawFigureDown(c, hasShield, hasWeapon);
    } else if (dx === 0 && dy < 0) {
      drawFigureUp(c, hasShield, hasWeapon);
    } else if (dy === 0) {
      if (dx > 0) ctx.scale(-1, 1);
      drawFigureSide(c, hasShield, hasWeapon);
    } else if (dy > 0) {
      if (dx > 0) ctx.scale(-1, 1);
      drawFigureDiagDown(c, hasShield, hasWeapon);
    } else {
      if (dx > 0) ctx.scale(-1, 1);
      drawFigureDiagUp(c, hasShield, hasWeapon);
    }

    ctx.restore();
  }

  function renderStage() {
    if (!ctx) return;
    ctx.clearRect(0, 0, W * TILE, H * TILE);
    for (var y = 0; y < H; y++) {
      for (var x = 0; x < W; x++) {
        if (!G.discovered[y][x]) continue;
        var t = G.grid[y][x];
        var lit = G.visible[y][x];
        if (t === T_WALL) drawWallTile(x, y, lit);
        else if (t === T_STAIRS) drawStairsTile(x, y, lit);
        else drawFloorTile(x, y, lit);
      }
    }
    for (var i = 0; i < G.floorItems.length; i++) {
      var it = G.floorItems[i];
      if (!G.discovered[it.y][it.x]) continue;
      drawEntityGlyph(it.x, it.y, it.def.sym, it.def.color, G.visible[it.y][it.x] ? 1 : 0.45, false);
    }
    for (var j = 0; j < G.enemies.length; j++) {
      var e = G.enemies[j];
      // 明かりの巻物の効果中は、視界に入っていない敵の位置も分かるようにする
      if (!G.visible[e.y][e.x] && !G.mapRevealActive) continue;
      drawMonster(e.x, e.y, e);
    }
    drawPlayerFigure(G.player.x, G.player.y);
    drawAttackEffect();
  }

  // Zキー攻撃の視覚フィードバック:攻撃先のマスに拳(素手)/剣(装備時)のマークを
  // 0.3秒ほど表示する。敵の有無に関わらず、攻撃(素振り含む)のたびに呼び出す。
  var ATTACK_EFFECT_MS = 300;
  var attackEffectTimer = null;

  function triggerAttackEffect(x, y) {
    if (attackEffectTimer) { clearTimeout(attackEffectTimer); attackEffectTimer = null; }
    G.attackEffect = { x: x, y: y, kind: G.player.weapon ? "sword" : "fist" };
    renderStage();
    attackEffectTimer = setTimeout(function () {
      attackEffectTimer = null;
      if (!G) return;
      G.attackEffect = null;
      renderStage();
    }, ATTACK_EFFECT_MS);
  }

  function drawAttackEffect() {
    if (!G.attackEffect) return;
    var cx = G.attackEffect.x * TILE + TILE / 2, cy = G.attackEffect.y * TILE + TILE / 2;
    ctx.save();
    if (G.attackEffect.kind === "fist") {
      // 打撃の余波(放射状の線)
      ctx.strokeStyle = "rgba(255,220,150,0.9)";
      ctx.lineWidth = Math.max(1, TILE * 0.05);
      ctx.lineCap = "round";
      for (var a = 0; a < 6; a++) {
        var ang = (a / 6) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(ang) * TILE * 0.26, cy + Math.sin(ang) * TILE * 0.26);
        ctx.lineTo(cx + Math.cos(ang) * TILE * 0.48, cy + Math.sin(ang) * TILE * 0.48);
        ctx.stroke();
      }
      // こぶし本体
      ctx.fillStyle = "#e0b48a";
      ctx.beginPath();
      ctx.arc(cx, cy, TILE * 0.22, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#8a5a3a";
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.strokeStyle = "#8a5a3a";
      ctx.lineWidth = 1;
      for (var k = -1; k <= 1; k++) {
        ctx.beginPath();
        ctx.moveTo(cx + k * TILE * 0.09, cy - TILE * 0.15);
        ctx.lineTo(cx + k * TILE * 0.09, cy - TILE * 0.02);
        ctx.stroke();
      }
    } else {
      // 振り下ろした剣の軌跡(残像の二重線+着弾の光)
      ctx.lineCap = "round";
      ctx.strokeStyle = "rgba(230,236,240,0.5)";
      ctx.lineWidth = Math.max(1, TILE * 0.08);
      ctx.beginPath();
      ctx.moveTo(cx - TILE * 0.42, cy - TILE * 0.5);
      ctx.lineTo(cx + TILE * 0.3, cy + TILE * 0.22);
      ctx.stroke();
      ctx.strokeStyle = "#eef3f6";
      ctx.lineWidth = Math.max(1, TILE * 0.11);
      ctx.beginPath();
      ctx.moveTo(cx - TILE * 0.34, cy - TILE * 0.42);
      ctx.lineTo(cx + TILE * 0.38, cy + TILE * 0.3);
      ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,0.85)";
      ctx.beginPath();
      ctx.arc(cx + TILE * 0.38, cy + TILE * 0.3, TILE * 0.09, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  /* =========================================================
     セーブ / ロード
  ========================================================= */
  function saveGame() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(G)); } catch (e) { /* ignore */ }
  }
  function loadSavedGame() {
    try {
      var raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (e) { return null; }
  }
  function clearSave() {
    try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignore */ }
  }

  /* =========================================================
     開始 / 終了フロー
  ========================================================= */
  // 開始時点の持ち物。何も持たない状態だと序盤の空腹管理が厳しく餓死しやすいため、
  // 大きなおにぎりを1つ持たせておく。
  function giveStartingItems() {
    var bigOnigiri = ITEM_TYPES.filter(function (it) { return it.key === "onigiri_big"; })[0];
    if (bigOnigiri) addItemToInventory(bigOnigiri);
  }

  function startNewGame() {
    clearSave();
    if (attackEffectTimer) { clearTimeout(attackEffectTimer); attackEffectTimer = null; }
    G = newRunState();
    giveStartingItems();
    document.getElementById("screen-title").hidden = true;
    document.getElementById("screen-end").hidden = true;
    enterFloor(1);
    renderAll();
    saveGame();
  }

  function continueGame(saved) {
    if (attackEffectTimer) { clearTimeout(attackEffectTimer); attackEffectTimer = null; }
    G = saved;
    G.gameOver = false;
    G.attackEffect = null; // 保存前に表示中だったエフェクトは復元時に消しておく
    document.getElementById("screen-title").hidden = true;
    document.getElementById("screen-end").hidden = true;
    computeVisibility();
    addMessage("続きから再開した。", "note");
    renderAll();
  }

  function triggerGameOver() {
    clearSave();
    document.getElementById("end-title").textContent = "力尽きた…";
    document.getElementById("end-desc").textContent = "迷宮の奥深く、地下" + G.floor + "階で力尽きてしまった。";
    fillEndStats();
    document.getElementById("screen-end").hidden = false;
  }

  function triggerClear() {
    clearSave();
    G.gameOver = true;
    document.getElementById("end-title").textContent = "迷宮を制覇した!";
    document.getElementById("end-desc").textContent = "ついに地下50階の王を討ち、迷宮の最深部を制覇した。";
    fillEndStats();
    document.getElementById("screen-end").hidden = false;
  }

  function fillEndStats() {
    var el = document.getElementById("end-stats");
    el.innerHTML =
      '<span class="label">到達階</span><span>地下' + G.floor + '階</span>' +
      '<span class="label">レベル</span><span>Lv.' + G.player.level + '</span>' +
      '<span class="label">経過ターン</span><span>' + G.turn + '</span>' +
      '<span class="label">攻撃力/防御力</span><span>' + effAtk() + ' / ' + effDef() + '</span>';
  }

  /* =========================================================
     入力
  ========================================================= */
  // z は攻撃アクション専用。q/e/c は固定の斜め移動キーとしてそのまま残す。
  // 上下左右(矢印/WASD)と x は「x を押しながら方向キー」で任意の斜め方向に
  // 移動できるよう、下の held-key 方式で個別に扱う(KEY_MAPには含めない)。
  var KEY_MAP = {
    q: [-1, -1], e: [1, -1], c: [1, 1],
    " ": [0, 0], ".": [0, 0]
  };

  // 上下左右キーの押下状態と、xキーが押されているかどうかを保持する(押されている間
  // true、離したら即false)。
  var heldDir = { up: false, down: false, left: false, right: false };
  var xHeld = false;
  // 方向キー単体の移動は、コンボ形成の猶予として少しだけ遅らせて実行する
  // (人が2〜3キーをほぼ同時に押しても、ブラウザには数十ms前後した順でイベントが
  // 届くことがあるため。長押し中のキーリピートはこの遅延の対象外にして、
  // 移動の反応が鈍くならないようにしてある)。
  var PLAIN_MOVE_DELAY_MS = 60;
  // 縦横どちらかの方向キーが既に押されている状態で、もう一方の軸の方向キーが
  // 新たに押された場合は「斜め移動を狙っている」とみなし、xキーの到着をより長く待つ。
  // 押す順序(横→縦、縦→横のどちらでも)に関わらず同じロジックで扱われるため、
  // 片方の順序でしか斜め移動が成立しない、という偏りは起きない。
  var COMBO_AWAIT_DELAY_MS = 150;
  var pendingMoveTimers = { up: null, down: null, left: null, right: null };

  // 右手は十字キー(矢印キー)専用、左手はアクションキー(Z/X/S)という操作分担にするため、
  // 移動はWASDを廃止し矢印キーのみで行う。空いたSキーは射撃(投擲)キーに割り当てる。
  function normalizeDirKey(key) {
    if (key === "ArrowUp") return "up";
    if (key === "ArrowDown") return "down";
    if (key === "ArrowLeft") return "left";
    if (key === "ArrowRight") return "right";
    return null;
  }

  // dirと反対の軸(上下 vs 左右)の方向キーが今まさに押されているかどうか。
  function otherAxisHeld(dir) {
    if (dir === "up" || dir === "down") return heldDir.left || heldDir.right;
    return heldDir.up || heldDir.down;
  }

  // xキーを押しながら上下左右のうち縦横1つずつが押されていれば、
  // その組み合わせの斜め方向へ移動する。片方だけ(上下のみ・左右のみ)の入力は無視する。
  function tryXComboMove() {
    var dx = (heldDir.left ? -1 : 0) + (heldDir.right ? 1 : 0);
    var dy = (heldDir.up ? -1 : 0) + (heldDir.down ? 1 : 0);
    if (dx !== 0 && dy !== 0) movePlayer(dx, dy);
  }

  function cancelPendingMove(dir) {
    if (pendingMoveTimers[dir] !== null) { clearTimeout(pendingMoveTimers[dir]); pendingMoveTimers[dir] = null; }
  }

  function schedulePlainMove(dir) {
    cancelPendingMove(dir);
    pendingMoveTimers[dir] = setTimeout(function () {
      pendingMoveTimers[dir] = null;
      // 猶予時間内にxが押されなければ通常の単発移動として実行する。
      // (キーをすぐ離した「タップ」でも移動できるよう、方向キーが今も
      // 押されているかどうかはここでは条件にしない。xとの組み合わせに
      // 昇格した場合は cancelPendingMove 側で明示的にキャンセル済み)
      if (!xHeld) { movePlayer(DIR_VECTOR[dir][0], DIR_VECTOR[dir][1]); }
    }, PLAIN_MOVE_DELAY_MS);
  }

  // 既に別の軸の方向キーが押された状態で新たに押されたキー用。xの到着をより長く待ち、
  // 猶予時間内にxが来なければ(=斜め移動ではなかった)、最後に押したこちらの方向へ
  // 単発移動する。もう一方の軸の保留中タイマーは呼び出し側で明示的にキャンセルする
  // ため、xが来なかった場合に2回分の単発移動が二重に発生することはない。
  function scheduleComboAwaitMove(dir) {
    cancelPendingMove(dir);
    pendingMoveTimers[dir] = setTimeout(function () {
      pendingMoveTimers[dir] = null;
      if (!xHeld) { movePlayer(DIR_VECTOR[dir][0], DIR_VECTOR[dir][1]); }
    }, COMBO_AWAIT_DELAY_MS);
  }

  var DIR_VECTOR = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

  window.addEventListener("keydown", function (ev) {
    if (!G || G.gameOver) return;
    var key = ev.key.length === 1 ? ev.key.toLowerCase() : ev.key;
    if (key === "z") { ev.preventDefault(); performPlayerAction(); return; }
    if (key === "s") { ev.preventDefault(); performThrowAction(); return; }
    if (key === "x") {
      ev.preventDefault();
      xHeld = true;
      cancelPendingMove("up"); cancelPendingMove("down");
      cancelPendingMove("left"); cancelPendingMove("right");
      tryXComboMove();
      return;
    }
    var dir = normalizeDirKey(key);
    if (dir) {
      ev.preventDefault();
      // 別軸(縦/横)の方向キーが既に押された状態での新規プレスかどうか。押す順序が
      // 横→縦・縦→横のどちらでも同じ扱いになるので、斜め移動の成立に偏りは出ない。
      var comboAttempt = !xHeld && !ev.repeat && otherAxisHeld(dir);
      heldDir[dir] = true;
      if (xHeld) {
        cancelPendingMove(dir);
        tryXComboMove();
      } else if (comboAttempt) {
        // 斜め移動を狙っている可能性が高いので、両軸の保留中タイマーをキャンセルし、
        // xの到着をより長く待つ(scheduleComboAwaitMove)。
        cancelPendingMove("up"); cancelPendingMove("down");
        cancelPendingMove("left"); cancelPendingMove("right");
        scheduleComboAwaitMove(dir);
      } else if (ev.repeat) {
        movePlayer(DIR_VECTOR[dir][0], DIR_VECTOR[dir][1]); // 押しっぱなし中は従来通り即座に反応
      } else {
        schedulePlainMove(dir); // 最初の一押しだけ、xとの組み合わせが来るかを少し待つ
      }
      return;
    }
    var v = KEY_MAP[key];
    if (v) { ev.preventDefault(); movePlayer(v[0], v[1]); }
  });

  window.addEventListener("keyup", function (ev) {
    var key = ev.key.length === 1 ? ev.key.toLowerCase() : ev.key;
    if (key === "x") { xHeld = false; return; }
    var dir = normalizeDirKey(key);
    // すぐ離す「タップ」でも移動できるよう、離しても保留中の単発移動はキャンセルしない
    if (dir) { heldDir[dir] = false; }
  });

  document.getElementById("dpad").addEventListener("click", function (ev) {
    var btn = ev.target.closest("button");
    if (!btn || !G || G.gameOver) return;
    movePlayer(parseInt(btn.getAttribute("data-dx"), 10), parseInt(btn.getAttribute("data-dy"), 10));
  });

  document.getElementById("btn-action").addEventListener("click", function () {
    performPlayerAction();
  });

  document.getElementById("btn-shoot").addEventListener("click", function () {
    performThrowAction();
  });

  document.getElementById("inv-list").addEventListener("click", function (ev) {
    var btn = ev.target.closest("button");
    if (!btn || !G || G.gameOver) return;
    var idx = parseInt(btn.getAttribute("data-idx"), 10);
    var act = btn.getAttribute("data-act");
    if (act === "use") useInventorySlot(idx);
    else if (act === "drop") dropInventorySlot(idx);
  });

  document.getElementById("btn-new-game").addEventListener("click", startNewGame);
  document.getElementById("btn-restart").addEventListener("click", startNewGame);
  document.getElementById("btn-continue").addEventListener("click", function () {
    var saved = loadSavedGame();
    if (saved) continueGame(saved);
    else startNewGame();
  });

  /* =========================================================
     初期化
  ========================================================= */
  function init() {
    ctx = document.getElementById("stage").getContext("2d");
    var saved = loadSavedGame();
    if (saved && !saved.gameOver) {
      document.getElementById("btn-continue").hidden = false;
    }
  }

  init();
})();
</script>
